name: Source Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  release:
    name: source-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Validate release source
        run: |
          python3 -m compileall -q zpilot.py scripts tests
          python3 -m unittest discover -s tests -v
          python3 scripts/validate_repo.py
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
          else
            gh release create "$TAG" --repo "$GH_REPO" --verify-tag --generate-notes --title "$TAG"
          fi
